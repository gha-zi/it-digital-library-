<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberMatrix Knowledge Base | الأرشيف التقني</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #31103d 100%);
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --glass-hover: rgba(255, 255, 255, 0.12);
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --accent-color: #38bdf8;
            --shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        html.light {
            --bg-gradient: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 50%, #cbd5e1 100%);
            --glass-bg: rgba(255, 255, 255, 0.7);
            --glass-border: rgba(0, 0, 0, 0.1);
            --glass-hover: rgba(255, 255, 255, 0.9);
            --text-color: #0f172a;
            --text-muted: #64748b;
            --accent-color: #0284c7;
            --shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
            scroll-behavior: smooth;
        }

        body {
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-color);
            min-height: 100vh;
            overflow-x: hidden;
            transition: 0.3s ease;
        }

        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            box-shadow: var(--shadow);
            border-radius: 20px;
        }

        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            padding: 15px 5%;
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 25px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.4rem;
            font-weight: 900;
            color: var(--text-color);
            text-decoration: none;
        }

        .logo i {
            color: var(--accent-color);
            filter: drop-shadow(0 0 10px var(--accent-color));
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .search-box {
            position: relative;
            display: flex;
            align-items: center;
        }

        .search-box input {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            padding: 10px 40px 10px 15px;
            border-radius: 30px;
            color: var(--text-color);
            font-size: 0.95rem;
            outline: none;
            width: 220px;
            transition: 0.3s;
        }

        .search-box input:focus {
            width: 280px;
            border-color: var(--accent-color);
        }

        .search-box i {
            position: absolute;
            right: 15px;
            color: var(--text-muted);
        }

        .theme-toggle-btn, .cart-btn {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            color: var(--text-color);
            padding: 10px 16px;
            border-radius: 30px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
            transition: 0.3s;
        }

        .theme-toggle-btn:hover, .cart-btn:hover {
            background: var(--accent-color);
            color: #fff;
            border-color: var(--accent-color);
        }

        .cart-count {
            background: #ef4444;
            color: white;
            font-size: 0.75rem;
            padding: 2px 6px;
            border-radius: 50%;
        }

        .hero {
            max-width: 1200px;
            margin: 140px auto 40px;
            padding: 0 5%;
            text-align: center;
        }

        .hero h1 {
            font-size: 2.8rem;
            font-weight: 900;
            margin-bottom: 15px;
            background: linear-gradient(to right, #38bdf8, #a855f7, #f43f5e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero p {
            font-size: 1.15rem;
            color: var(--text-muted);
            max-width: 700px;
            margin: 0 auto;
            line-height: 1.6;
        }

        .main-container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 5%;
        }

        .section-title {
            font-size: 1.8rem;
            font-weight: 800;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .section-title i {
            color: #a855f7;
        }

        .categories-filter {
            display: flex;
            gap: 12px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .filter-btn {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            color: var(--text-color);
            padding: 8px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.95rem;
            transition: 0.3s;
        }

        .filter-btn.active, .filter-btn:hover {
            background: var(--accent-color);
            color: #fff;
            border-color: var(--accent-color);
            font-weight: 700;
        }

        .books-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
        }

        .book-card {
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: 0.4s ease;
            position: relative;
            overflow: hidden;
        }

        .book-card:hover {
            transform: translateY(-8px);
            border-color: var(--accent-color);
        }

        .book-img-container {
            width: 100%;
            height: 180px;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 15px;
            position: relative;
        }

        .book-img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: 0.4s ease;
        }

        .book-card:hover .book-img-container img {
            transform: scale(1.05);
        }

        .book-badge {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(168, 85, 247, 0.4);
            backdrop-filter: blur(5px);
            color: #fff;
            font-size: 0.75rem;
            padding: 3px 10px;
            border-radius: 10px;
        }

        .book-info h3 {
            font-size: 1.15rem;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .book-author {
            font-size: 0.88rem;
            color: var(--accent-color);
            margin-bottom: 12px;
            cursor: pointer;
            display: inline-block;
            font-weight: 700;
        }

        .book-author:hover {
            text-decoration: underline;
        }

        .book-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            font-size: 0.9rem;
        }

        .rating {
            color: #facc15;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .price {
            font-size: 1.1rem;
            font-weight: 900;
            color: #34d399;
        }

        .add-to-cart-btn {
            width: 100%;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            color: var(--text-color);
            padding: 10px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: 0.3s;
        }

        .add-to-cart-btn:hover {
            background: var(--accent-color);
            color: #fff;
            border-color: var(--accent-color);
        }

        /* Modal Details */
        .details-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            z-index: 3000;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .details-modal.active {
            display: flex;
        }

        .details-content {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            padding: 30px;
            border-radius: 20px;
            max-width: 600px;
            width: 100%;
            position: relative;
            box-shadow: var(--shadow);
            backdrop-filter: blur(20px);
        }

        .details-content h2 {
            margin-bottom: 10px;
            color: var(--accent-color);
        }

        .details-content p {
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 15px;
        }

        .close-details {
            position: absolute;
            top: 20px;
            left: 20px;
            background: none;
            border: none;
            color: var(--text-color);
            font-size: 1.3rem;
            cursor: pointer;
        }

        /* Cart Drawer */
        .cart-modal {
            position: fixed;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: 2000;
            transition: 0.4s ease;
            display: flex;
            justify-content: flex-start;
        }

        .cart-modal.active {
            left: 0;
        }

        .cart-drawer {
            width: 400px;
            max-width: 90%;
            height: 100%;
            background: var(--glass-bg);
            backdrop-filter: blur(25px);
            border-left: 1px solid var(--glass-border);
            padding: 25px;
            display: flex;
            flex-direction: column;
        }

        .cart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--glass-border);
            padding-bottom: 15px;
        }

        .cart-items {
            flex-grow: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .cart-item {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            padding: 12px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .checkout-btn {
            width: 100%;
            background: var(--accent-color);
            color: #fff;
            border: none;
            padding: 12px;
            border-radius: 12px;
            font-weight: 800;
            cursor: pointer;
            margin-top: 15px;
        }

        footer {
            text-align: center;
            padding: 30px;
            color: var(--text-muted);
            border-top: 1px solid var(--glass-border);
            margin-top: 60px;
        }
    </style>
  </head>
